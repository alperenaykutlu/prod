name: faurecia
description: "Faurecia Fabrika Barkod Takip Sistemi - 3 RF Gun ile üretim, kırılma ve silo bölgesi transferleri"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  uuid: ^4.4.2

  # Device
  vibration: ^2.0.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.6.2
  build_runner: ^2.4.13
  mockito: ^5.4.4
  sqflite_common_ffi: ^2.3.4+1

flutter:
  uses-material-design: true
